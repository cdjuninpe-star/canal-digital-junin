name: "📻 Grabación Automática de Radio en la Nube"

on:
  schedule:
    # Radio Tarma (99.3 FM) a las 6:30 AM PET (11:30 UTC)
    - cron: '30 11 * * 1,2,3,4,5'
    # Radio Tarma (99.3 FM) a las 1:00 PM PET (18:00 UTC)
    - cron: '0 18 * * 1,2,3,4,5'
    
  # Permite ejecutarlo manualmente cuando quieras desde GitHub o Panel Admin
  workflow_dispatch:
    inputs:
      station:
        description: "Emisora a grabar (o 'auto' para procesar programadas)"
        required: true
        default: "rdo_rtarma"
        type: string
      duration:
        description: "Duración en segundos (Ej: 3600 = 1 hora, 7200 = 2 horas)"
        required: true
        default: "3600"
        type: string
      custom_title:
        description: "Título opcional del noticiero o programa"
        required: false
        default: ""
        type: string

jobs:
  record-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🎙️ Verificar e Instalar FFmpeg
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            echo "Instalando FFmpeg..."
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          else
            echo "FFmpeg ya se encuentra disponible en el entorno."
          fi

      - name: 🔴 Grabar Radio y Guardar en Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME || 'bk9klm2l' }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          STATION_ID: ${{ inputs.station || 'auto' }}
          RECORD_DURATION_SECS: ${{ inputs.duration || '3600' }}
          CUSTOM_TITLE: ${{ inputs.custom_title || '' }}
        run: |
          if [ ! -f "scripts/record-radio.mjs" ]; then
            echo "================================================================"
            echo "❌ ERROR: No se encontró el archivo scripts/record-radio.mjs"
            echo "Abre el panel de administración y haz clic en 'Sincronizar y Subir Archivos a GitHub'"
            echo "================================================================"
            exit 1
          fi
          node scripts/record-radio.mjs "$STATION_ID" "$RECORD_DURATION_SECS" "$CUSTOM_TITLE"
